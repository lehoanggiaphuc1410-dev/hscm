    <!-- SCRIPT TÍCH HỢP FIREBASE AUTHENTICATION (ĐÃ FIX TOÀN BỘ NÚT BẤM & PERSISTENCE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBXDX98b8p17vrvQu1OVhwIvqtrtKTbel0",
            authDomain: "hcmut-smart-campus-map.firebaseapp.com",
            projectId: "hcmut-smart-campus-map",
            storageBucket: "hcmut-smart-campus-map.firebasestorage.app",
            messagingSenderId: "881977232661",
            appId: "1:881977232661:web:db0144004d14a4c116ed1c",
            measurementId: "G-DCFK06D9CT"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Thiết lập nhớ phiên đăng nhập
        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Lỗi Auth Persistence:", error);
        });

        const provider = new GoogleAuthProvider();

        // 1. CHỈ TỰ ĐỘNG CHUYỂN TRANG NẾU ĐÃ ĐĂNG NHẬP VÀ ĐANG Ở CHẾ ĐỘ AUTHENTICATED
        onAuthStateChanged(auth, (user) => {
            if (user && localStorage.getItem('bk_user_mode') === 'authenticated') {
                window.location.replace('choncoso.html');
            }
        });

        // 2. XỬ LÝ NÚT ĐĂNG NHẬP GOOGLE
        const loginBtn = document.getElementById('login-btn');
        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                const icon = document.getElementById('google-icon');
                const text = document.getElementById('login-text');
                const originalIconHtml = icon ? icon.innerHTML : '';
                
                if (text) text.innerText = 'Đang kiểm tra phiên...';
                if (icon) icon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg text-white"></i>';
                loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
                loginBtn.disabled = true;

                // Nếu đã có thông tin user từ trước
                if (auth.currentUser) {
                    localStorage.setItem('bk_user_mode', 'authenticated');
                    localStorage.setItem('bk_user_info', JSON.stringify({
                        name: auth.currentUser.displayName,
                        email: auth.currentUser.email,
                        avatar: auth.currentUser.photoURL
                    }));
                    window.location.replace('choncoso.html');
                    return;
                }

                // Mở Popup Google nếu chưa có phiên
                try {
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    localStorage.setItem('bk_user_mode', 'authenticated');
                    localStorage.setItem('bk_user_info', JSON.stringify({
                        name: user.displayName,
                        email: user.email,
                        avatar: user.photoURL
                    }));
                    window.location.replace('choncoso.html');
                } catch (error) {
                    if (text) text.innerText = 'Đăng nhập với Google';
                    if (icon) icon.innerHTML = originalIconHtml;
                    loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    loginBtn.disabled = false;
                    
                    if (error.code !== 'auth/popup-closed-by-user') {
                        console.error("Lỗi đăng nhập:", error);
                        alert("Đăng nhập thất bại. Vui lòng thử lại!");
                    }
                }
            });
        }

        // 3. XỬ LÝ NÚT THAM QUAN (KHÁCH)
        const guestBtn = document.getElementById('guest-btn');
        if (guestBtn) {
            guestBtn.addEventListener('click', () => {
                localStorage.setItem('bk_user_mode', 'guest');
                localStorage.removeItem('bk_user_info');
                window.location.replace('choncoso.html');
            });
        }
    </script>
   <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('PWA Ready:', reg.scope))
            .catch((err) => console.error('PWA Error:', err));
        });
      }
    </script>
</body>
