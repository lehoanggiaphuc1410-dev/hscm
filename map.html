<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Smart Campus | HCMUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#033285">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bk: {
                            navy: '#0A2540',
                            darkBlue: '#002147',
                            blue: '#0284C7',
                            lightBlue: '#38BDF8',
                            ice: '#F0F9FF',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-full flex flex-col" onclick="closeUserDropdown(event)">

    <!-- HEADER 1 NÚT ĐỔI CƠ SỞ -->
    <header class="bg-bk-darkBlue text-white shadow-md border-b border-slate-800 relative z-50 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="choncoso.html" class="flex items-center space-x-3 cursor-pointer no-underline">
                <div class="w-9 h-9 bg-white rounded-lg p-1 flex items-center justify-center shadow">
                    <img src="logo hcmut.png" alt="Logo HCMUT" class="w-full h-full object-contain">
                </div>
                <div>
                    <span class="text-base font-extrabold tracking-tight text-white block leading-none">BK CAMPUS MAP</span>
                    <span id="campus-badge" class="block text-[9px] font-bold uppercase tracking-widest text-sky-400 mt-1">Đang tải cơ sở...</span>
                </div>
            </a>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <a href="thoikhoabieu.html" id="btn-tkb" class="flex items-center gap-1.5 px-2.5 py-1.5 sm:px-3 bg-white/70 backdrop-blur-md border border-white/50 text-slate-700 hover:text-blue-600 font-semibold text-xs rounded-xl shadow-md hover:bg-white/90 transition-all duration-300 active:scale-95 cursor-pointer no-underline">
    <i class="fa-solid fa-calendar-check text-blue-500 text-xs"></i>
    <span>Thời khóa biểu</span>
</a>

                <a href="choncoso.html" class="text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 px-2.5 py-1.5 sm:px-3 rounded-xl border border-slate-700/60 text-xs font-semibold flex items-center space-x-1.5 transition-all no-underline">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                    <span class="hidden sm:inline">Đổi Cơ Sở</span>
                </a>

                <div class="relative">
                    <button id="user-menu-btn" type="button" class="flex items-center space-x-2 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/60 py-1.5 px-2.5 sm:px-3 rounded-xl transition-all cursor-pointer focus:outline-none">
                        <img id="user-avatar" src="" alt="User Avatar" class="w-7 h-7 rounded-full border border-sky-400 hidden object-cover">
                        <div class="text-right hidden sm:block">
                            <p id="user-name" class="text-xs font-semibold text-slate-200 leading-tight">Đang tải...</p>
                            <p id="user-role" class="text-[9px] text-sky-400 leading-tight">Sinh viên</p>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-0.5"></i>
                    </button>

                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 text-slate-800 z-50">
                        <div class="px-4 py-2 border-b border-slate-100">
                            <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Tài khoản</span>
                            <p id="dropdown-user-email" class="text-xs text-slate-600 truncate font-medium mt-0.5"></p>
                        </div>
                        <button id="logout-btn" type="button" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50 flex items-center space-x-2 transition-colors">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Đăng xuất tài khoản</span>
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </header>

    <!-- SIDEBAR & BẢN ĐỒ -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <aside class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-md flex-shrink-0">
            <div class="p-4 border-b border-slate-100 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Tìm tòa nhà, phòng học, nhà xe..." class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-transparent rounded-xl text-xs sm:text-sm focus:bg-white focus:border-bk-blue focus:outline-none transition-all">
                </div>

                <div id="target-building-alert" class="hidden bg-sky-50 border border-sky-200 text-bk-blue px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-between">
                    <span><i class="fa-solid fa-location-dot mr-1"></i>Đang xem tòa nhà: <b id="target-building-name">C5</b></span>
                    <button type="button" onclick="clearTargetBuilding()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div id="building-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Render danh sách khu vực -->
            </div>
        </aside>

        <main class="flex-1 bg-slate-200 relative overflow-hidden flex items-center justify-center p-4">
            <div id="map-container" class="w-full h-full bg-white rounded-2xl shadow-inner border border-slate-300 overflow-hidden relative flex items-center justify-center">
                <img id="map-image" src="" alt="Bản đồ cơ sở" class="max-w-full max-h-full object-contain">
                <div id="map-loading" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center space-y-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-bk-blue"></i>
                    <span class="text-xs font-semibold text-slate-600">Đang tải dữ liệu bản đồ...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT TỰ ĐỘNG -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXDX98b8p17vrvQu1OVhwIvqtrtKTbel0",
            authDomain: "hcmut-smart-campus-map.firebaseapp.com",
            projectId: "hcmut-smart-campus-map",
            storageBucket: "hcmut-smart-campus-map.firebasestorage.app",
            messagingSenderId: "881977232661",
            appId: "1:881977232661:web:db0144004d14a4c116ed1c",
            measurementId: "G-DCFK06D9CT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const selectedCampus = localStorage.getItem('selected_campus') || 'cs1';
        const userMode = localStorage.getItem('bk_user_mode');
        const userInfo = JSON.parse(localStorage.getItem('bk_user_info') || '{}');
        const targetBuilding = localStorage.getItem('target_building');

        const campusData = {
            cs1: {
                title: 'Cơ sở 1 - Lý Thường Kiệt',
                image: 'cs1.jpg',
                buildings: [
                    { id: 'A', name: 'Tòa nhà A (A1 - A4)', desc: 'Phòng Đào tạo, BGH, các khoa chuyên ngành' },
                    { id: 'B', name: 'Tòa nhà B (B1 - B12)', desc: 'Khu giảng đường & Phòng học chính CS1' },
                    { id: 'C', name: 'Tòa nhà C (C1 - C6)', desc: 'Phòng thí nghiệm & Hội trường C5' },
                    { id: 'H', name: 'Khu Nhà H', desc: 'Trung tâm nghiên cứu & Lớp học nâng cao' }
                ]
            },
            cs2: {
                title: 'Cơ sở 2 - Dĩ An',
                image: 'cs2.jpg',
                buildings: [
                    { id: 'H1', name: 'Tòa nhà H1', desc: 'Giảng đường lớn sinh viên năm 1 & 2' },
                    { id: 'H2', name: 'Tòa nhà H2', desc: 'Khu học tập & Phòng hội thảo' },
                    { id: 'H3', name: 'Tòa nhà H3', desc: 'Khu văn phòng khoa & Phòng thí nghiệm' },
                    { id: 'H6', name: 'Tòa nhà H6', desc: 'Tòa nhà trung tâm hiện đại nhất CS2' }
                ]
            }
        };

        const currentData = campusData[selectedCampus] || campusData.cs1;
        document.getElementById('campus-badge').innerText = currentData.title;
        
        const mapImg = document.getElementById('map-image');
        mapImg.src = currentData.image;
        mapImg.onload = () => {
            document.getElementById('map-loading').classList.add('hidden');
        };

        if (targetBuilding) {
            const alertBox = document.getElementById('target-building-alert');
            document.getElementById('target-building-name').innerText = targetBuilding;
            alertBox.classList.remove('hidden');
        }

        window.clearTargetBuilding = function() {
            localStorage.removeItem('target_building');
            document.getElementById('target-building-alert').classList.add('hidden');
        };

        const listContainer = document.getElementById('building-list');
        listContainer.innerHTML = currentData.buildings.map(b => {
            const isHighlight = targetBuilding && b.id.includes(targetBuilding);
            return `
                <div class="p-3.5 rounded-xl border ${isHighlight ? 'border-bk-blue bg-sky-50 ring-2 ring-sky-300' : 'border-slate-100 hover:border-sky-300 hover:bg-sky-50/50'} transition-all cursor-pointer group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold px-2 py-0.5 rounded ${isHighlight ? 'bg-bk-blue text-white' : 'bg-slate-100 text-slate-700 group-hover:bg-bk-blue group-hover:text-white'} transition-colors">${b.id}</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:text-bk-blue"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-800 mt-1.5 group-hover:text-bk-blue transition-colors">${b.name}</h3>
                    <p class="text-[11px] text-slate-500 mt-0.5">${b.desc}</p>
                </div>
            `;
        }).join('');

        const profileContainer = document.getElementById('user-menu-btn').parentElement;
        if (userMode === 'authenticated') {
            profileContainer.classList.remove('hidden');
            document.getElementById('user-name').innerText = userInfo.name || 'Sinh viên HCMUT';
            document.getElementById('dropdown-user-email').innerText = userInfo.email || 'Sinh viên HCMUT';

            if (userInfo.avatar) {
                const avatar = document.getElementById('user-avatar');
                avatar.src = userInfo.avatar;
                avatar.classList.remove('hidden');
            }
        } else {
            profileContainer.classList.add('hidden');
        }

        const menuBtn = document.getElementById('user-menu-btn');
        const dropdown = document.getElementById('user-dropdown');
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
        window.closeUserDropdown = function(e) { if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.add('hidden'); };

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try { await signOut(auth); } catch (e) {}
            localStorage.clear();
            window.location.replace('index.html');
        });
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Kiểm tra chế độ đăng nhập
        const userMode = localStorage.getItem('bk_user_mode');
        
        // Nếu là khách (guest) thì ẩn nút TKB đi
        if (userMode === 'guest') {
            const tkbButton = document.getElementById('btn-tkb');
            if (tkbButton) {
                tkbButton.style.display = 'none'; // Ẩn hoàn toàn
                // Hoặc dùng: tkbButton.classList.add('hidden'); (nếu bạn dùng Tailwind)
            }
        }
    });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Đã kích hoạt PWA thành công 🚀', reg.scope))
        .catch((err) => console.error('Lỗi PWA:', err));
    });
  }
</script>
</body>
</html>
